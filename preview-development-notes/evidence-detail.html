<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Euthyphro — Evidence detail</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../refinements.css"><style>body{margin:0;background:#efe8db;color:#202623;font-family:Inter,system-ui,sans-serif}.pop{max-width:720px;margin:auto;padding:30px}.eyebrow{font-size:.68rem;text-transform:uppercase;letter-spacing:.12em;color:#81543f;font-weight:800}.pop h1,.pop h2{font-family:Georgia,serif;font-weight:400}.pop h1{font-size:2.4rem;margin:.25rem 0 1rem}.intro{color:#56605a;line-height:1.55}.status{display:inline-block;border:1px solid #81543f;border-radius:999px;padding:5px 9px;color:#81543f;font-size:.65rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}.timeline{margin-top:24px;background:#f9f4ea;border:1px solid #cfc4b3;padding:20px}.time-row{display:grid;grid-template-columns:110px 18px 1fr;gap:10px;align-items:start;padding:10px 0}.year{font-weight:800;color:#81543f;font-size:.8rem}.stem{position:relative;min-height:58px}.stem:before{content:'';position:absolute;left:7px;top:3px;bottom:-14px;border-left:1px solid #b8aa98}.stem:after{content:'';position:absolute;left:3px;top:5px;width:9px;height:9px;border-radius:50%;background:#193a39}.time-row:last-child .stem:before{display:none}.time-copy b{font-family:Georgia,serif;font-weight:400;font-size:1.05rem}.time-copy p{margin:.25rem 0;color:#59635d;line-height:1.45}.detail{margin-top:18px;padding:18px;background:#193a39;color:#efe8db}.detail p{color:#d1d9d3;line-height:1.55}.sources{margin-top:18px}.sources ul{padding-left:20px;line-height:1.55;color:#4f5752}.external{display:inline-block;margin-top:10px;padding:10px 12px;border:1px solid #193a39;color:#193a39;text-decoration:none;background:#fffaf1}.close{display:inline-block;margin-bottom:18px;background:none;border:0;color:#193a39;text-decoration:underline;cursor:pointer;padding:0}</style></head><body><main class="pop"><button class="close" onclick="window.close()">Close window</button><div id="content"></div></main><script>
const D={
stoa:{title:'Stoa Basileios',status:'Explicit in the text · archaeologically attested',intro:'Plato names the Basileus’ stoa in Euthyphro 2a. The building is therefore both textual evidence and a recoverable archaeological location.',times:[['c. 399 BCE','Dramatic setting','Socrates and Euthyphro meet around the Stoa of the Basileus.'],['Ancient testimony','Institutional associations','Literary and epigraphic testimony connects the building with the Archon Basileus and legal-religious functions.'],['1970s','Archaeological investigation','Excavation of the northwest Agora identified remains interpreted as the Royal Stoa.'],['Present research','Spatial re-reading','The prototype tests what changes when the named place is treated as a situated institutional and material environment.']],detail:'High confidence applies to the archaeological identification and general location. The exact dramatic standing point, appearance in 399 BCE and what any receiver noticed remain separate questions.',sources:['Plato, Euthyphro 2a, Burnet (1900).','Athenian Agora III: Literary and Epigraphical Testimonia.','ASCSA Athenian Agora excavation records.','Paga (2021), Building Democracy in Late Archaic Athens.']},
herms:{title:'Herm bases and “The Herms”',status:'Contextual evidence · materially attested',intro:'Herm bases and ancient testimony support a substantial hermic presence around the northwest Agora. Plato does not enumerate them in the surviving passage.',times:[['5th c. BCE','Material and civic presence','Herms formed part of the visible civic and religious landscape of Athens.'],['415 BCE','Mutilation of the herms','Thucydides records the mutilation and the political anxiety that followed.'],['1970 excavation','Material recovery','Finds around the Royal Stoa include herm bases and related fragments.'],['Present research','Memory association','The prototype tests whether material presence plus remembered civic narrative can alter the contextual horizon of the scene.']],detail:'The archaeology supports presence in the area, but not a complete reconstruction of every herm in 399 BCE. Presence also does not establish that every receiver noticed or associated them with the same narrative.',sources:['Thucydides 6.27–29.','Athenian Agora III: Literary and Epigraphical Testimonia.','ASCSA excavation records for the northwest Agora.','Steinbock (2012), Social Memory in Athenian Public Discourse.']},
zeus:{title:'Stoa of Zeus Eleutherios',status:'Contextual evidence · neighbouring place',intro:'The Stoa of Zeus Eleutherios stood immediately beside the Royal Stoa and forms part of the recoverable built environment of the encounter.',times:[['Classical period','Neighbouring monument','The Stoa of Zeus Eleutherios occupied the west/northwest Agora beside the Royal Stoa.'],['Ancient testimony','Socratic association','Ancient traditions associate Socrates with conversations in or around this area; each testimony requires individual verification.'],['Euthyphro 5a','Zeus enters the dialogue','Euthyphro invokes Zeus in defending divine precedent concerning fathers and sons.'],['Present research','Proximity as a question','The prototype tests whether the spatial proximity is interpretatively worth considering without treating it as evidence of intention.']],detail:'The proximity is archaeologically strong. Any connection between the neighbouring stoa, Socratic habit and Euthyphro’s invocation of Zeus remains an interpretative proposition to be tested.',sources:['ASCSA Agora plans and monument records.','Athenian Agora III: Literary and Epigraphical Testimonia.','Plato, Euthyphro 5a.','Paga (2021).']},
approach:{title:'Panathenaic approach',status:'Contextual evidence · topographical',intro:'The Royal Stoa marked the northwest entrance to the Agora, close to the Panathenaic route and major converging streets.',times:[['Classical period','Movement into the Agora','The route relationship structured arrival into the northwest civic space.'],['Excavation and planning','Topography recovered','Plans and excavation reports establish the relationship between the Royal Stoa, roads and Agora entrance.'],['Present research','Movement analysis','The prototype asks how approach, orientation and threshold may affect the reading of dramatic placement.']],detail:'The broad route relationship is recoverable. Exact travelled surfaces, traffic and the route taken by a dramatic character in a particular moment are reconstructed.',sources:['ASCSA Athenian Agora plans and excavation reports.','Paga (2021), for movement and access.']},
shrine:{title:'Classical shrine and votive material',status:'Contextual evidence · archaeological',intro:'Excavation east of the Royal Stoa recovered a small Classical shrine and substantial votive material, adding a religious dimension not stated in Plato’s opening.',times:[['Classical period','Cult activity','The shrine and offerings belong to the religious landscape of the northwest Agora.'],['Excavation','Material recovery','Archaeological work recovered the shrine context and masses of offerings.'],['Present research','Contextual comparison','The prototype tests whether the density of religious material around the named legal-religious setting forms a meaningful pattern.']],detail:'The excavation context is attested. Exact chronology of individual objects must be checked before asserting presence in 399 BCE, and perceptual salience remains unknown.',sources:['ASCSA Athenian Agora excavation reports and digital records.']},
eridanos:{title:'Eridanos channel',status:'Contextual evidence · reconstructed infrastructure',intro:'The Eridanos was channelled through the Agora in the Classical period and ran beside the northwest approach and Royal Stoa area.',times:[['Classical period','Canalised watercourse','The channel formed part of the physical infrastructure of the Agora.'],['Excavation','Course reconstructed','Archaeological evidence allows the channel’s route to be mapped.'],['Present research','Environmental context','The prototype treats infrastructure as part of the recoverable setting while keeping sensory claims separate.']],detail:'The course can be reconstructed with reasonable confidence. Noise, smell, visibility and individual awareness cannot simply be inferred from presence.',sources:['ASCSA / Hesperia reports on the Eridanos channel and Agora infrastructure.']},
basileus:{title:'King Archon and legal-religious procedure',status:'Contextual evidence · institutional',intro:'The office of the Archon Basileus gives the named setting a legal and religious institutional dimension.',times:[['Classical Athens','Office and jurisdiction','The Basileus held responsibilities involving religious law and particular legal procedures.'],['Euthyphro 2a','Textual activation','Euthyphro immediately recognises the significance of Socrates being at the Basileus’ stoa.'],['Present research','Institutional context','The prototype asks what institutional knowledge an individual receiver might not need Plato to explain.']],detail:'Institutional functions are recoverable from testimony. What a particular receiver knew about them remains uncertain.',sources:['Plato, Euthyphro 2a.','Athenian Agora III: Literary and Epigraphical Testimonia.','ASCSA Royal Stoa material.']},
opening:{title:'Situated opening',status:'Interpretative synthesis',intro:'Across 2a–5a, place, prosecution, piety, kinship, divine precedent and institutional setting accumulate before the sustained definitional inquiry begins.',times:[['Euthyphro 2a','Place named','The dialogue opens by making Socrates’ location unusual and explicit.'],['2a–4','Legal and religious context develops','The cases of Socrates and Euthyphro introduce prosecution, religious authority and piety.'],['5a','Divine precedent','Zeus becomes part of Euthyphro’s defence of his action.'],['Present research','Synthesis','The project tests whether recovering situated evidence changes what questions can be asked of the opening.']],detail:'This record is explicitly interpretative. It links evidence categories but does not claim to recover Plato’s intention or a single original reception.',sources:['Plato, Euthyphro 2a–5a, Burnet (1900).','Sarah Burke (2019), MA dissertation, The Open University.','Steinbock (2012).']},
socrates:{title:'Socrates as a culturally loaded figure',status:'Collective-memory research trail',intro:'Socrates did not enter Athenian culture as a blank figure. Different representations and reputational narratives could form part of the background against which an individual encountered him.',times:[['423 BCE','Aristophanes’ Clouds','A comic Socrates appears in public performance decades before the trial.'],['399 BCE','Trial and execution','The historical trial supplies the dramatic horizon for Platonic representations of Socrates.'],['Platonic reception','Apology and other dialogues','Plato’s dramatic corpus contributes further representations of Socrates, but these should not be collapsed into one public image.'],['Present research','Competing memories','The project asks which narratives may have been available to particular individuals, not what any single community collectively believed.']],detail:'The purpose is to map culturally available representations and their chronology, not to infer a uniform collective judgement.',sources:['Aristophanes, Clouds.','Plato, Apology.','Steinbock (2012), for social-memory methodology.']}}
const q=new URLSearchParams(location.search).get('item')||'stoa',d=D[q]||D.stoa;document.title=`Euthyphro — ${d.title}`;document.querySelector('#content').innerHTML=`<div class="eyebrow">Evidence catalogue · research detail</div><h1>${d.title}</h1><span class="status">${d.status}</span><p class="intro">${d.intro}</p><section class="timeline"><div class="eyebrow">Chronology</div><h2>A short evidence biography</h2>${d.times.map(t=>`<div class="time-row"><div class="year">${t[0]}</div><div class="stem"></div><div class="time-copy"><b>${t[1]}</b><p>${t[2]}</p></div></div>`).join('')}</section><section class="detail"><div class="eyebrow" style="color:#d8b573">Research caution</div><p>${d.detail}</p></section><section class="sources"><div class="eyebrow">References & further research</div><ul>${d.sources.map(s=>`<li>${s}</li>`).join('')}</ul><a class="external" href="https://www.ascsa.edu.gr/excavations/athenian-agora/publications-and-resources" target="_blank" rel="noopener">Explore Athenian Agora publications & digital resources ↗</a></section>`;
</script></body></html>
