<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
<defs>
  <pattern id="paper" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#eee2c6"/><circle cx="8" cy="12" r="1.2" fill="#cdbf9f" opacity=".22"/><circle cx="35" cy="31" r="1" fill="#b9aa8b" opacity=".18"/></pattern>
  <pattern id="hill" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 16 Q9 3 18 16" fill="none" stroke="#978a69" stroke-width="1.2" opacity=".34"/></pattern>
  <style>
    .road{fill:none;stroke:#c3aa77;stroke-linecap:round;stroke-linejoin:round}.minor-road{fill:none;stroke:#d1bb8b;stroke-linecap:round}.water{fill:none;stroke:#6d9092;stroke-linecap:round}.bld{fill:#d7c49c;stroke:#695c47;stroke-width:3}.secure{fill:#ceb88b;stroke:#524737;stroke-width:4}.approx{fill:#ddd0b0;stroke:#766a53;stroke-width:3;stroke-dasharray:10 8}.sacred{fill:#d6bf9c;stroke:#8a5b43;stroke-width:3}.label{font-family:Georgia,serif;fill:#302c25;font-size:26px}.small{font-family:Inter,Arial,sans-serif;fill:#4e493f;font-size:18px;letter-spacing:.02em}.tiny{font-family:Inter,Arial,sans-serif;fill:#5e584c;font-size:14px}.area{font-family:Georgia,serif;fill:#6c634f;font-size:44px;letter-spacing:.1em}.route-label{font-family:Inter,Arial,sans-serif;fill:#7a6038;font-size:22px;font-weight:700;letter-spacing:.08em}.water-label{font-family:Inter,Arial,sans-serif;fill:#4f7476;font-size:18px;font-weight:700;letter-spacing:.08em}.key{font-family:Inter,Arial,sans-serif;fill:#403b32;font-size:15px}.highlight{fill:#a75a3f;stroke:#6e3626;stroke-width:5}.highlightText{font-family:Georgia,serif;fill:#6e3626;font-size:30px;font-weight:700}
  </style>
</defs>
<rect width="1600" height="1200" fill="url(#paper)"/>

<!-- terrain -->
<path d="M0 120 L300 75 L430 125 L390 360 L280 620 L90 710 L0 670 Z" fill="url(#hill)" opacity=".85"/>
<path d="M0 120 L300 75 L430 125 L390 360 L280 620 L90 710 L0 670 Z" fill="#b8aa80" opacity=".16"/>
<text x="88" y="315" class="area" transform="rotate(-71 88 315)">KOLONOS AGORAIOS</text>

<!-- Eridanos and northern road system -->
<path class="water" stroke-width="18" d="M95 150 C310 120 500 145 700 205 C885 260 1070 238 1280 170 C1405 130 1510 135 1600 160" opacity=".72"/>
<path class="water" stroke-width="5" d="M95 150 C310 120 500 145 700 205 C885 260 1070 238 1280 170 C1405 130 1510 135 1600 160"/>
<text x="1050" y="182" class="water-label">ERIDANOS</text>

<!-- Panathenaic Way -->
<path class="road" stroke-width="105" d="M520 85 C650 220 775 330 905 470 C1030 608 1140 755 1280 1015" opacity=".72"/>
<path d="M520 85 C650 220 775 330 905 470 C1030 608 1140 755 1280 1015" fill="none" stroke="#927343" stroke-width="4" stroke-dasharray="18 14" opacity=".65"/>
<text x="710" y="305" class="route-label" transform="rotate(43 710 305)">PANATHENAIC WAY</text>
<text x="1235" y="980" class="small" transform="rotate(60 1235 980)">toward Acropolis</text>

<!-- west road -->
<path class="minor-road" stroke-width="64" d="M430 245 C435 470 425 700 410 1015" opacity=".82"/>
<text x="390" y="770" class="small" transform="rotate(-88 390 770)">WEST ROAD OF AGORA</text>

<!-- open agora -->
<path d="M560 320 C760 305 995 350 1160 440 L1240 840 C1080 960 785 1015 555 900 C505 760 510 520 560 320 Z" fill="#e6d8b7" stroke="#b8a986" stroke-width="3" stroke-dasharray="12 9" opacity=".66"/>
<text x="820" y="715" class="area" opacity=".72">AGORA</text>

<!-- NW / north structures -->
<g>
  <rect x="445" y="190" width="118" height="92" class="highlight"/>
  <text x="306" y="175" class="highlightText">Stoa Basileios</text>
  <text x="305" y="199" class="tiny">explicit setting of Euthyphro 2a · attested location</text>

  <rect x="442" y="306" width="160" height="210" class="secure"/>
  <text x="214" y="400" class="label">Stoa of Zeus</text>
  <text x="214" y="426" class="small">Eleutherios</text>

  <rect x="650" y="150" width="136" height="72" class="approx"/>
  <text x="668" y="132" class="label">Stoa Poikile</text>
  <text x="668" y="154" class="tiny">approximate footprint</text>

  <rect x="790" y="245" width="92" height="82" class="sacred"/>
  <text x="800" y="235" class="small">Altar of the Twelve Gods</text>
</g>

<!-- western civic / sacred sequence -->
<g>
  <rect x="446" y="535" width="108" height="88" class="sacred"/>
  <text x="196" y="580" class="label">Apollo Patroos</text>

  <rect x="432" y="650" width="146" height="118" class="secure"/>
  <text x="190" y="700" class="label">New Bouleuterion</text>

  <rect x="438" y="792" width="138" height="92" class="secure"/>
  <text x="220" y="835" class="label">Metroon</text>

  <circle cx="500" cy="952" r="57" class="secure"/>
  <text x="234" y="962" class="label">Tholos</text>
</g>

<!-- Hephaisteion -->
<g>
  <path d="M78 330 C160 270 270 275 348 350 L315 510 C225 560 135 548 65 475 Z" fill="#b8aa80" opacity=".25" stroke="#958764" stroke-width="2"/>
  <rect x="150" y="365" width="130" height="80" class="sacred"/>
  <text x="104" y="345" class="label">Hephaisteion</text>
</g>

<!-- central monuments -->
<g>
  <rect x="710" y="600" width="205" height="34" class="approx"/>
  <text x="724" y="584" class="small">Monument of the Eponymous Heroes</text>
  <g fill="#7a6951" opacity=".55"><circle cx="725" cy="570" r="8"/><circle cx="765" cy="556" r="8"/><circle cx="805" cy="570" r="8"/><circle cx="845" cy="555" r="8"/></g>
</g>

<!-- eastern edge / shops -->
<g>
  <rect x="1180" y="360" width="170" height="88" class="approx"/>
  <rect x="1215" y="485" width="145" height="84" class="approx"/>
  <rect x="1225" y="610" width="150" height="90" class="approx"/>
  <text x="1220" y="330" class="label">Shops / public buildings</text>
  <text x="1222" y="352" class="tiny">classical east-side occupation, generalized</text>
</g>

<!-- south -->
<g>
  <rect x="680" y="980" width="410" height="80" class="secure"/>
  <text x="810" y="955" class="label">South Stoa I</text>
  <rect x="1160" y="930" width="110" height="90" class="sacred"/>
  <text x="1130" y="905" class="small">S.E. Fountain House</text>
  <rect x="1285" y="875" width="120" height="105" class="approx"/>
  <text x="1310" y="850" class="small">Mint</text>
</g>

<!-- Euthyphro-specific micro-context -->
<g>
  <ellipse cx="560" cy="245" rx="96" ry="58" fill="#4f7375" opacity=".10" stroke="#4f7375" stroke-width="3" stroke-dasharray="8 7"/>
  <text x="555" y="245" class="small" fill="#355f60">Herms / votive zone</text>
  <circle cx="585" cy="265" r="10" fill="#4f7375"/>
  <circle cx="615" cy="250" r="8" fill="#4f7375"/>
  <circle cx="640" cy="278" r="9" fill="#4f7375"/>
  <circle cx="566" cy="218" r="8" fill="#4f7375"/>
</g>

<!-- orientation -->
<g transform="translate(1428 72)">
  <path d="M38 74 L38 5 L22 28 L38 18 L54 28 Z" fill="#3f3a32"/>
  <text x="38" y="98" text-anchor="middle" class="small" font-weight="700">N</text>
</g>

<!-- map key -->
<g transform="translate(1060 1040)">
  <rect x="0" y="0" width="490" height="130" rx="8" fill="#f3ead7" stroke="#b8aa8a" stroke-width="2" opacity=".94"/>
  <rect x="20" y="24" width="28" height="20" class="secure"/><text x="60" y="41" class="key">attested / securely located</text>
  <rect x="20" y="58" width="28" height="20" class="approx"/><text x="60" y="75" class="key">reconstructed / generalized</text>
  <rect x="270" y="24" width="28" height="20" class="highlight"/><text x="310" y="41" class="key">Euthyphro setting</text>
  <line x1="270" y1="69" x2="305" y2="69" stroke="#6d9092" stroke-width="7"/><text x="316" y="75" class="key">watercourse</text>
  <text x="20" y="111" class="tiny">Original cartographic reconstruction from published archaeological plans; not an exact snapshot of 399 BCE.</text>
</g>
</svg>